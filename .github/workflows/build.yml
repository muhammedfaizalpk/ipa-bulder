name: Build Specific iOS PR

on:
  workflow_dispatch: # Allows you to manually trigger it with a click

env:
  TARGET_REPO: "willfaust/Madeira"           # 1. Change to the repository you want to test
  PR_NUMBER: "265"                    # 2. Change to the Pull Request number
  SCHEME_NAME: "MadeiraEpic"              # 3. Change to the target app's name

jobs:
  build:
    runs-on: macos-14 
    
    steps:
      - name: Fetch Unmerged PR Code
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: refs/pull/${{ env.PR_NUMBER }}/head

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      # Automatically finds where the .xcodeproj or .xcworkspace lives and sets it as an environment variable
      - name: Locate Xcode Files
        run: |
          PROJ_PATH=$(find . -name "*.xcodeproj" -o -name "*.xcworkspace" | head -n 1)
          if [ -z "$PROJ_PATH" ]; then
            echo "::error::No Xcode project found in the repository!"
            exit 1
          fi
          DIR_PATH=$(dirname "$PROJ_PATH")
          echo "PROJECT_DIR=$DIR_PATH" >> $GITHUB_ENV
          echo "Found project directory at: $DIR_PATH"

      - name: Resolve Dependencies
        run: |
          cd ${{ env.PROJECT_DIR }}
          if [ -f "Podfile" ]; then 
            pod install || echo "Pod install failed, attempting to continue..."
          fi
          if ls *.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved >/dev/null 2>&1; then
            xcodebuild -resolvePackageDependencies
          fi

      - name: Build Archive
        run: |
          cd ${{ env.PROJECT_DIR }}
          mkdir -p build
          if [ -d *.xcworkspace ]; then
            xcodebuild archive -workspace *.xcworkspace -scheme "${{ env.SCHEME_NAME }}" -configuration Release -archivePath build/App.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          else
            xcodebuild archive -project *.xcodeproj -scheme "${{ env.SCHEME_NAME }}" -configuration Release -archivePath build/App.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          fi

      - name: Create IPA Container
        run: |
          cd ${{ env.PROJECT_DIR }}
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/*.app build/Payload/
          zip -r App.ipa build/Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-${{ env.PR_NUMBER }}-build
          path: ${{ env.PROJECT_DIR }}/App.ipa
