name: Build Specific iOS PR

on:
  workflow_dispatch: # Allows you to manually trigger it with a click

env:
  TARGET_REPO: "willfaust/Madeira"           # 1. Change to the repository you want to test
  PR_NUMBER: "265"                    # 2. Change to the Pull Request number
  
jobs:
  build:
    runs-on: macos-14 
    
    steps:
      - name: Fetch Unmerged PR Code
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: refs/pull/${{ env.PR_NUMBER }}/head

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Locate Xcode Files
        run: |
          PROJ_PATH=$(find . -name "*.xcodeproj" -o -name "*.xcworkspace" | head -n 1)
          if [ -z "$PROJ_PATH" ]; then
            echo "::error::No Xcode project found in the repository!"
            exit 1
          fi
          DIR_PATH=$(dirname "$PROJ_PATH")
          echo "PROJECT_DIR=$DIR_PATH" >> $GITHUB_ENV
          echo "Found project directory at: $DIR_PATH"

      - name: Resolve Dependencies
        run: |
          cd ${{ env.PROJECT_DIR }}
          if [ -f "Podfile" ]; then 
            pod install || echo "Pod install failed, attempting to continue..."
          fi
          if ls *.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved >/dev/null 2>&1; then
            xcodebuild -resolvePackageDependencies
          fi

      - name: Force Disable Code Signing
        run: |
          cd ${{ env.PROJECT_DIR }}
          echo "Stripping code-signing requirements from xcodeproj configs..."
          find . -name "project.pbxproj" -exec sed -i '' 's/DEVELOPMENT_TEAM = [A-Z0-9]*;//g' {} +
          find . -name "project.pbxproj" -exec sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' {} +
          find . -name "project.pbxproj" -exec sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "";/g' {} +
          find . -name "project.pbxproj" -exec sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Distribution";/CODE_SIGN_IDENTITY = "";/g' {} +
          find . -name "project.pbxproj" -exec sed -i '' '/PROVISIONING_PROFILE/d' {} +

      # AUTOMATICALLY DISCOVERS THE EXACT SCHEME NAME
      - name: Auto-Detect Xcode Scheme
        run: |
          cd ${{ env.PROJECT_DIR }}
          echo "--- Available Schemes Matrix ---"
          xcodebuild -list
          
          # Extracts the first valid build scheme from the project settings
          if [ -d *.xcworkspace ]; then
            DETECTED_SCHEME=$(xcodebuild -workspace *.xcworkspace -list | awk '/Schemes:/{flag=1;next} /^$/{flag=0} flag' | sed 's/^[ \t]*//' | head -n 1)
          else
            DETECTED_SCHEME=$(xcodebuild -project *.xcodeproj -list | awk '/Schemes:/{flag=1;next} /^$/{flag=0} flag' | sed 's/^[ \t]*//' | head -n 1)
          fi
          
          if [ -z "$DETECTED_SCHEME" ]; then
            echo "::error::Could not auto-detect any Xcode schemes!"
            exit 1
          fi
          
          echo "REAL_SCHEME=$DETECTED_SCHEME" >> $GITHUB_ENV
          echo "Successfully targeted real scheme: $DETECTED_SCHEME"

      - name: Build Archive
        run: |
          cd ${{ env.PROJECT_DIR }}
          mkdir -p build
          
          BUILD_FLAGS="CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=\"\" CODE_SIGN_ENTITLEMENTS=\"\" PROVISIONING_PROFILE=\"\" AD_HOC_CODE_SIGNING_ALLOWED=YES"
          
          if [ -d *.xcworkspace ]; then
            xcodebuild archive -workspace *.xcworkspace -scheme "${{ env.REAL_SCHEME }}" -configuration Release -archivePath build/App.xcarchive $BUILD_FLAGS
          else
            xcodebuild archive -project *.xcodeproj -scheme "${{ env.REAL_SCHEME }}" -configuration Release -archivePath build/App.xcarchive $BUILD_FLAGS
          fi

      - name: Create IPA Container
        run: |
          cd ${{ env.PROJECT_DIR }}
          mkdir -p build/Payload
          
          APP_PATH=$(find build/App.xcarchive/Products/Applications/ -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Compiled .app bundle not found in archive!"
            exit 1
          fi
          
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r App.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-${{ env.PR_NUMBER }}-build
          path: ${{ env.PROJECT_DIR }}/build/App.ipa
