name: Build Specific iOS PR

on:
  workflow_dispatch: # Allows you to manually trigger it with a click

env:
  TARGET_REPO: "willfaust/Madeira"           # 1. Change to the repository you want to test
  PR_NUMBER: "265"                    # 2. Change to the Pull Request number
  SCHEME_NAME: "MadeiraEpic"              # 3. Change to the target app's name

jobs:
  build:
    # Using macos-14 as macOS-latest might have queue bottlenecks
    runs-on: macos-14 
    
    steps:
      # 1. Pulls the unmerged PR branch code automatically and safely
      - name: Fetch Unmerged PR Code
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: refs/pull/${{ env.PR_NUMBER }}/head

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      # 2. Resolves Swift Packages or CocoaPods dependencies automatically
      - name: Resolve Dependencies
        run: |
          if [ -f "Podfile" ]; then 
            pod install || echo "Pod install failed, attempting to continue..."
          fi
          if ls *.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved >/dev/null 2>&1; then
            xcodebuild -resolvePackageDependencies
          fi

      # 3. Compiles the app using a robust fallback layout
      - name: Build Archive
        run: |
          mkdir -p $PWD/build
          if [ -d *.xcworkspace ]; then
            xcodebuild archive -workspace *.xcworkspace -scheme "${{ env.SCHEME_NAME }}" -configuration Release -archivePath $PWD/build/App.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          else
            xcodebuild archive -project *.xcodeproj -scheme "${{ env.SCHEME_NAME }}" -configuration Release -archivePath $PWD/build/App.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          fi

      # 4. Packs it into the .ipa container structure
      - name: Create IPA Container
        run: |
          mkdir -p $PWD/build/Payload
          cp -r $PWD/build/App.xcarchive/Products/Applications/*.app $PWD/build/Payload/
          cd $PWD/build
          zip -r App.ipa Payload

      # 5. Uploads the file for download
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-${{ env.PR_NUMBER }}-build
          path: build/App.ipa
